<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Форма</title>

    <link rel="stylesheet" href="normalize.css">
    <link rel="stylesheet" href="style (2).css">
</head>

<body>

<form class="form">

    <fieldset class="form-group">

        <legend class="form-group-title">
            Ваши личные данные
        </legend>

        <label class="label" for="name">
            Ваше имя
        </label>

        <input
            class="input"
            id="name"
            name="name"
            type="text"
            placeholder="Имя"
            required
        >

        <label class="label" for="age">
            Ваш возраст
        </label>

        <input
            class="input"
            id="age"
            name="age"
            type="number"
            placeholder="Возраст"
            required
        >

        <label class="label" for="phone">
            Ваш номер телефона
        </label>

        <input
            class="input"
            id="phone"
            name="phone"
            type="tel"
            placeholder="89999999999"
            required
        >

        <label class="label" for="email">
            Ваша почта
        </label>

        <input
            class="input"
            id="email"
            name="email"
            type="email"
            placeholder="Почта"
            required
        >

    </fieldset>

    <fieldset class="form-group">

        <label class="label" for="message">
            Сообщение
        </label>

        <textarea
            class="textarea"
            id="message"
            name="message"
            placeholder="Ваше сообщение"
            required
        ></textarea>

        <label class="checkbox-label">

            <input
                class="checkbox"
                type="checkbox"
                name="checkbox"
                required
            >

            <span class="checkbox-text">
                Я принимаю правила
            </span>

        </label>

        <button class="button" type="submit">
            Отправить
        </button>

    </fieldset>

</form>

</body>
</html>
